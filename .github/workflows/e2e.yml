name: E2E regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    name: Playwright (post-build)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      # Set in the repo secrets — required for auth-gated flows.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_PEECHO_BUTTON_KEY: ${{ secrets.VITE_PEECHO_BUTTON_KEY }}
      # Optional: a Playwright storageState JSON pre-populated with a signed-in
      # Buildy test account. When empty, auth-gated tests are skipped.
      PLAYWRIGHT_STORAGE_STATE: ${{ secrets.PLAYWRIGHT_STORAGE_STATE_PATH }}
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lockb', 'package.json') }}

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Vitest unit tests
        run: bun run test

      - name: Build production bundle
        run: bun run build

      - name: Playwright regression suite (against vite preview)
        run: bun run test:e2e:preview

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
