name: Setup Buildy toolchain
description: Installeert de vastgezette Node- en Bun-toolchain met een frozen lockfile.

runs:
  using: composite
  steps:
    - name: Set up Node.js 22
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22.16.0

    - name: Set up Bun 1.3.3
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.3

    - name: Verify toolchain versions
      shell: bash
      run: |
        set -euo pipefail
        test "$(bun --version)" = "1.3.3"
        node --version
        bun --version

    - name: Restore Bun download cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-1.3.3-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-${{ runner.arch }}-1.3.3-

    - name: Install dependencies from lockfile
      shell: bash
      run: bun install --frozen-lockfile

    - name: Verify dependency manifests stayed unchanged
      shell: bash
      run: git diff --exit-code -- package.json bun.lock
